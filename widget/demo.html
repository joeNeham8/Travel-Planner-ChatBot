<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kerala Backwater Tours — Widget Demo</title>
<style>
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #F6F3EC;
    color: #1C2422;
  }
  .hero { max-width: 720px; margin: 80px auto; padding: 0 24px; }
  h1 { font-family: Georgia, serif; font-size: 32px; margin-bottom: 8px; }
  p { line-height: 1.6; color: #444; }
  code { background: #eee; padding: 2px 6px; border-radius: 4px; }
</style>
</head>
<body>
  <div class="hero">
    <h1>Kerala Backwater Tours</h1>
    <p>This is a plain host page standing in for a real travel agency site. The chat launcher in the bottom-right corner is the embedded widget — click it to talk to Hannah.</p>
    <p>Change <code>data-api-base</code> below to point at your running backend (e.g. <code>http://localhost:8000</code>) before testing.</p>
  </div>

  <script
    src="./widget.js"
    data-api-base="http://localhost:8000"
    data-agency-name="Kerala Backwater Tours"
  ></script>
</body>
</html>
